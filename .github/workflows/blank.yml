name: Build ReChat Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository Code
        uses: actions/checkout@v4

      - name: 2. Setup Bun & Node.js
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 3. Setup Java 21 for Android
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 4. Locate Project & Build ReChat APK
        run: |
          # Авто-ढूँढें कि package.json कहाँ है (चाहे बाहर हो या सब-फ़ोल्डर में)
          PKG_PATH=$(find . -maxdepth 3 -name "package.json" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "Error: package.json nahi mila! Kripya apni ZIP files upload karein."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Project mila: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Dependencies install aur Web App Build
          bun install --no-save || npm install --legacy-peer-deps --force
          bun run build || npm run build

          # Capacitor aur Android Project taiyar karein
          bun add @capacitor/core @capacitor/cli @capacitor/android || npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --force
          npx cap init "ReChat" "com.rechat.voicegroup" --web-dir=dist
          npx cap add android

          # Voice Chat aur Internet ke liye zaroori Permissions jodein
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <application/' android/app/src/main/AndroidManifest.xml

          # Final Android APK Compile karein
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

          # APK ko bahar root folder me copy karein taaki upload ho sake
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ReChat-App.apk"

      - name: 5. Upload Final ReChat APK
        uses: actions/upload-artifact@v4
        with:
          name: ReChat-Voice-Group-Chat-APK
          path: ReChat-App.apk
          
name: Build ReChat Android APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Setup Bun & Node
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: 3. Setup Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: 4. Extract ZIP (if any) & Build APK
        run: |
          # Agar repository mein koi .zip file hai to use automatic extract karein
          for z in *.zip; do
            if [ -f "$z" ]; then
              echo "ZIP file mili: $z, extract kar rahe hain..."
              unzip -o "$z" -d extracted_app
            fi
          done

          # Ab package.json ko kisi bhi folder ke andar se dhundhein
          PKG_PATH=$(find . -name "package.json" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$PKG_PATH" ]; then
            echo "ERROR: Repository mein koi code ya ZIP file nahi mili! Pehle Code tab mein jakar apni files upload karein."
            ls -la
            exit 1
          fi

          PROJECT_DIR=$(dirname "$PKG_PATH")
          echo "Project folder mila: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Dependencies install aur Web Build
          bun install --no-save || npm install --legacy-peer-deps --force
          bun run build || npm run build

          # Capacitor & Android setup
          bun add @capacitor/core @capacitor/cli @capacitor/android || npm install @capacitor/core @capacitor/cli @capacitor/android --legacy-peer-deps --force
          npx cap init "ReChat" "com.rechat.voicegroup" --web-dir=dist
          npx cap add android

          # Permissions add karein
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.RECORD_AUDIO" \/>\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" \/>\n    <application/' android/app/src/main/AndroidManifest.xml

          # APK Compile karein
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

          # Final APK ko bahar copy karein
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/ReChat-App.apk"

      - name: 5. Upload ReChat APK
        uses: actions/upload-artifact@v4
        with:
          name: ReChat-Voice-Group-Chat-APK
          path: ReChat-App.apk
          
